name: CI

on:
  push:
    branches: [main]
  pull_request:

# The eval gate is law: every PR must keep build/test/clippy/fmt green AND keep
# the active stage's fitness gate passing. See AGENTS.md and kortex/specs/.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: .

jobs:
  check:
    name: build / test / clippy / fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --locked
      - name: Tests
        run: cargo test --locked

  gate:
    name: stage fitness gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      # Stage 1: compression gate (recall >= 95% within the M1 Air RAM budget).
      # Synthetic source keeps it fast and deterministic; the verdict is
      # N-independent so a small set still validates the budget.
      - name: Stage 1 compression gate
        run: >
          cargo run --release --locked -p kortex-harness -- compress-bench
          --source synthetic --dim 256 --vectors 4000 --queries 100 --assert-gate
      # Stage 1 (IVF): the earned next move — per-list 1-bit RaBitQ residual
      # codes. Same three-part budget (recall ≥ 0.95, p95 ≤ 150ms, resident@5M
      # ≤ 250MB) on a small mild-geometry index. The 5M RAM projection is split
      # (per-vec linear + sqrt(n) centroids) so the verdict is N-independent;
      # recall is deterministic, so a small N validates correctness for CI.
      - name: Stage 1 IVF gate
        run: >
          cargo run --release --locked -p kortex-harness -- scale-bench
          --scale 20k --dim 256 --clusters 64 --index ivf --nprobe 12,24
          --refine 1024 --queries 100 --assert-gate
      # Stage 2: storage substrate gate (content overhead ≤ 1.25x;
      # index bytes/unit ≤ 24; p95 < 1ms; ingest ≥ 50k/s).
      # Uses the Stage 0 synthetic corpus — deterministic, no external deps.
      - name: Stage 2 store gate
        run: >
          cargo run --release --locked -p kortex-harness -- store-bench
          --years 5 --assert-gate
      # Stage 4: sleep scheduler policy gate (all six metrics over a scripted
      # week — no work while blocked, full drain, step budget, determinism).
      - name: Stage 4 sleep gate
        run: >
          cargo run --release --locked -p kortex-harness -- sleep-sim
          --assert-gate
      # Derivation Ledger: staleness propagation over a derivation DAG built from
      # the corpus's planted contradictions — ledger must reach invalidation
      # recall 1.0 at 0 over-invalidation with real signal, vs a provenance-free
      # baseline that detects nothing. Deterministic; no LLM.
      - name: Derivation Ledger gate
        run: >
          cargo run --release --locked -p kortex-harness -- ledger-bench
          --assert-gate
      # Stage 3 (GraphRAG): the typed-relation retriever must clear the multi-hop
      # bars (recall@10 >= 0.50, ans@10 >= 0.60) and not regress single-hop recall
      # below BM25. Deterministic; no inference (the LLM tier is replay-only).
      - name: Stage 3 graph gate
        run: >
          cargo run --release --locked -p kortex-harness -- graph-eval
          --assert-gate

  ffi:
    name: ffi gate (C-ABI / Python parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # Stage 6: builds the kortex_ffi cdylib/staticlib, runs the Rust
      # C-ABI/two_stage_search parity + symbol-existence tests, and (since
      # python3 is present here) the Python `ctypes` parity check against the
      # same fixture. Non-zero on any mismatch.
      - name: Stage 6 FFI gate
        run: bash scripts/ffi-gate.sh
