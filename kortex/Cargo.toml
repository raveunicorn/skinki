[workspace]
resolver = "2"
members = [
    "crates/kortex-corpus",
    "crates/kortex-eval",
    "crates/kortex-telemetry",
    "crates/kortex-baseline",
    "crates/kortex-harness",
]

# Kortex — the portable local memory + insight engine (Stage 0: eval harness).
# Philosophy: maximum with minimum means. Dependencies are kept deliberately
# small; the synthetic corpus uses a hand-rolled deterministic PRNG so the
# ground truth is byte-reproducible across platforms and CI.

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"
rust-version = "1.80"
repository = "https://github.com/raveunicorn/Skinki"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
anyhow = "1"
kortex-corpus = { path = "crates/kortex-corpus" }
kortex-eval = { path = "crates/kortex-eval" }
kortex-telemetry = { path = "crates/kortex-telemetry" }
kortex-baseline = { path = "crates/kortex-baseline" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
