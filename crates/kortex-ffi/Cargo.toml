[package]
name = "kortex-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Stage 6: portable C-ABI over the Stage 1 two-stage search engine (cdylib + staticlib)."

[lib]
name = "kortex_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
kortex-vector.workspace = true
serde_json.workspace = true

[[bin]]
# Dev/gate-only helper: writes a tiny deterministic index (rabitq.idx +
# base.f32) plus a JSON dump of the query and the expected Rust
# `two_stage_search` ids, so `scripts/ffi-gate.sh` can run a Python `ctypes`
# parity check against the same fixture without re-implementing index
# construction in Python.
name = "ffi-fixture"
path = "src/bin/ffi_fixture.rs"
